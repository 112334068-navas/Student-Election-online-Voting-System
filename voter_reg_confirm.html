<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voter Registration Confirmation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .confirmation-container {
            background: #ffffff;
            width: 450px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        .confirmation-container h1 {
            color: #2a5298;
            margin-bottom: 10px;
        }

        .confirmation-container p {
            color: #555;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .success-icon {
            font-size: 60px;
            color: #28a745;
            margin-bottom: 15px;
        }

        .details-box {
            background: #f4f6f9;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 20px;
        }

        .details-box p {
            margin: 8px 0;
            font-size: 14px;
        }

        .btn-group {
            margin-top: 20px;
        }

        .btn {
            text-decoration: none;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
        }

        .btn-home {
            background-color: #2a5298;
            color: white;
        }

        .btn-login {
            background-color: #28a745;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="confirmation-container">

    <div class="success-icon">✔</div>

    <h1>Registration Successful!</h1>

    <p>Your voter registration has been completed successfully.</p>

    <div class="details-box">
        <p><strong>Name:</strong> John Doe</p>
        <p><strong>Student ID:</strong> STU2026001</p>
        <p><strong>Department:</strong> Computer Science</p>
        <p><strong>Email:</strong> johndoe@email.com</p>
    </div>

    <p>You can now login to cast your vote during the election period.</p>

    <div class="btn-group">
        <a href="home.html" class="btn btn-home">Go to Home</a>
        <a href="login.html" class="btn btn-login">Login Now</a>
    </div>

</div>

</body>
</html>
